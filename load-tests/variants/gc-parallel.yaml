# Load-test variant: the Java services with -XX:+UseParallelGC (compare with load-tests/run.mjs --compose-extra).
x-jvm: &jvm
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:+UseParallelGC"
services:
  gateway:
    environment: *jvm
  risk-service:
    environment: *jvm
  control-service:
    environment: *jvm
