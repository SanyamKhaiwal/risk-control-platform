# Weekly update pull requests for every kind of dependency; CI (ci.yml) tests each one before it can be merged.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*"] }
  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly }
    ignore:
      # Long-term-support lines only: Node 22, Temurin 25 (non-LTS majors are short-lived).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
