apiVersion: v1
kind: Namespace
metadata:
  name: rcp
  labels:
    # Pods here must meet the "restricted" Pod Security Standard where they can; the data stores run official
    # images that start as root, so the namespace enforces "baseline" and warns about anything below "restricted".
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
