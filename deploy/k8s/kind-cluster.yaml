# A one-node local Kubernetes cluster (kind) for the platform. The edge (nginx, HTTPS) is a NodePort on 30443,
# published on the host as https://localhost:8443. Created by: node scripts/k8s.mjs up
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rcp
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
